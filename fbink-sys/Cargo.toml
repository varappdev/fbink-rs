[package]
name = "fbink-sys"
description = "Raw FFI bindings to FBInk, a library to print text & images to an eInk Linux framebuffer"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
links = "fbink"
build = "build.rs"
exclude = ["build.rs.orig"]

[dependencies]

[build-dependencies]
cc = "1"
bindgen = "0.73"

[features]
# Mirrors FBInk's own MINIMAL build flags: without any feature this builds
# FBInk in its bare MINIMAL configuration (no text, no drawing, no images).
# `default` reproduces a standard full-featured FBInk build.
default = ["draw", "bitmap", "fonts", "image", "opentype", "input"]

# FBINK_WITH_DRAW: basic drawing primitives (implied by most other features)
draw = []
# FBINK_WITH_BITMAP: fixed-cell font rendering + the base IBM font (implies draw)
bitmap = ["draw"]
# FBINK_WITH_FONTS: the full set of bundled fixed-cell fonts (implies bitmap)
fonts = ["bitmap"]
# FBINK_WITH_UNIFONT: embed GNU Unifont for extreme Unicode coverage (implies fonts,
# adds ~2MB to the binary!)
unifont = ["fonts"]
# FBINK_WITH_IMAGE: image & framebuffer dump support (implies draw)
image = ["draw"]
# FBINK_WITH_OPENTYPE: TrueType/OpenType font rendering (implies draw)
opentype = ["draw"]
# FBINK_WITH_INPUT: input device scanning utilities
input = []
# FBINK_WITH_BUTTON_SCAN: deprecated Kobo-only USBMS "Connect" button scanner (implies draw)
button-scan = ["draw"]
